<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Filter for soft watercolor diffusion -->
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
    </filter>

    <filter id="gentle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
    </filter>

    <!-- Clip path to keep inside 400x400 canvas -->
    <clipPath id="canvas-clip">
      <rect x="0" y="0" width="400" height="400" rx="2" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <g clip-path="url(#canvas-clip)">
    <!-- Base Canvas Color (Muted Slate Sky Blue) -->
    <rect width="400" height="400" fill="#789FBC" />

    <!-- Organic Pastel Watercolor Clouds -->
    <!-- Mint / Emerald Greens in top and right -->
    <path d="M 170 -40 Q 280 20 380 -20 Q 440 100 410 190 Q 330 220 280 150 Q 210 110 160 50 Z" fill="#3EBD8B" filter="url(#soft-blur)" opacity="0.92" />
    <path d="M 230 40 Q 360 80 390 190 Q 310 240 260 170 Q 220 110 210 60 Z" fill="#52CCA0" filter="url(#soft-blur)" opacity="0.85" />
    <circle cx="330" cy="110" r="95" fill="#32A979" filter="url(#soft-blur)" opacity="0.88" />

    <!-- Soft Candy Rose / Pink Cloud in center and right -->
    <ellipse cx="235" cy="185" rx="85" ry="65" fill="#EE94B8" filter="url(#soft-blur)" opacity="0.88" />
    <circle cx="280" cy="190" r="75" fill="#E882AB" filter="url(#soft-blur)" opacity="0.85" />
    <path d="M 180 140 Q 250 120 290 160 Q 320 220 250 240 Q 180 230 170 180 Z" fill="#F4AEC7" filter="url(#soft-blur)" opacity="0.9" />

    <!-- Deep Teal / Sea Blue Cloud in lower left -->
    <path d="M -30 200 Q 80 170 150 240 Q 160 340 90 420 Q -20 420 -40 310 Z" fill="#4B7799" filter="url(#soft-blur)" opacity="0.92" />
    <circle cx="80" cy="300" r="110" fill="#3D6888" filter="url(#soft-blur)" opacity="0.8" />
    <circle cx="60" cy="180" r="80" fill="#6992AF" filter="url(#soft-blur)" opacity="0.75" />

    <!-- Light Airy Pale Cyan / Mint Highlights -->
    <ellipse cx="360" cy="270" rx="70" ry="90" fill="#7CD6B5" filter="url(#gentle-blur)" opacity="0.65" />
    <ellipse cx="140" cy="70" rx="75" ry="50" fill="#92B8D2" filter="url(#gentle-blur)" opacity="0.7" />

    <!-- Translucent Glass Sheen / Reflection Stripes (Diagonal) -->
    <g opacity="0.22">
      <!-- Broad primary glare stripe -->
      <polygon points="0,210 160,0 215,0 0,285" fill="#FFFFFF" />
      <!-- Secondary thinner glare stripe -->
      <polygon points="0,320 245,0 265,0 0,350" fill="#FFFFFF" />
      <!-- Corner glare -->
      <polygon points="200,400 400,135 400,195 245,400" fill="#FFFFFF" opacity="0.6" />
    </g>

    <!-- Ferris Wheel Structure (Crisp Black Line Art) -->
    <!-- Support A-Frame Legs -->
    <g stroke="#18181B" stroke-width="4" stroke-linecap="round">
      <line x1="195" y1="205" x2="170" y2="340" />
      <line x1="205" y1="205" x2="230" y2="340" />
    </g>

    <!-- Outer Rim Wheel -->
    <circle cx="200" cy="205" r="96" fill="none" stroke="#18181B" stroke-width="4" />

    <!-- Spokes (8 radial directions) -->
    <g stroke="#18181B" stroke-width="3.5" stroke-linecap="round">
      <!-- 12 o'clock (0°) -->
      <line x1="200" y1="192" x2="200" y2="109" />
      <!-- 1:30 (45°) -->
      <line x1="209" y1="196" x2="268" y2="137" />
      <!-- 3 o'clock (90°) -->
      <line x1="213" y1="205" x2="296" y2="205" />
      <!-- 4:30 (135°) -->
      <line x1="209" y1="214" x2="268" y2="273" />
      <!-- 6 o'clock (180°) -->
      <line x1="200" y1="218" x2="200" y2="301" />
      <!-- 7:30 (225°) -->
      <line x1="191" y1="214" x2="132" y2="273" />
      <!-- 9 o'clock (270°) -->
      <line x1="187" y1="205" x2="104" y2="205" />
      <!-- 10:30 (315°) -->
      <line x1="191" y1="196" x2="132" y2="137" />
    </g>

    <!-- Center Hub -->
    <circle cx="200" cy="205" r="13" fill="#FAF7F2" stroke="#18181B" stroke-width="3.8" />

    <!-- 8 Passenger Gondolas / Cabins with horizontal bar -->
    <!-- Gondola 1: Top (200, 109) -->
    <g transform="translate(200, 109)">
      <circle cx="0" cy="0" r="15" fill="#FAF7F2" stroke="#18181B" stroke-width="3.5" opacity="0.95" />
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#18181B" stroke-width="3.5" />
    </g>

    <!-- Gondola 2: Top-Right (268, 137) -->
    <g transform="translate(268, 137)">
      <circle cx="0" cy="0" r="15" fill="#FAF7F2" stroke="#18181B" stroke-width="3.5" opacity="0.95" />
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#18181B" stroke-width="3.5" />
    </g>

    <!-- Gondola 3: Right (296, 205) -->
    <g transform="translate(296, 205)">
      <circle cx="0" cy="0" r="15" fill="#FAF7F2" stroke="#18181B" stroke-width="3.5" opacity="0.95" />
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#18181B" stroke-width="3.5" />
    </g>

    <!-- Gondola 4: Bottom-Right (268, 273) -->
    <g transform="translate(268, 273)">
      <circle cx="0" cy="0" r="15" fill="#FAF7F2" stroke="#18181B" stroke-width="3.5" opacity="0.95" />
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#18181B" stroke-width="3.5" />
    </g>

    <!-- Gondola 5: Bottom (200, 301) -->
    <g transform="translate(200, 301)">
      <circle cx="0" cy="0" r="15" fill="#FAF7F2" stroke="#18181B" stroke-width="3.5" opacity="0.95" />
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#18181B" stroke-width="3.5" />
    </g>

    <!-- Gondola 6: Bottom-Left (132, 273) -->
    <g transform="translate(132, 273)">
      <circle cx="0" cy="0" r="15" fill="#FAF7F2" stroke="#18181B" stroke-width="3.5" opacity="0.95" />
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#18181B" stroke-width="3.5" />
    </g>

    <!-- Gondola 7: Left (104, 205) -->
    <g transform="translate(104, 205)">
      <circle cx="0" cy="0" r="15" fill="#FAF7F2" stroke="#18181B" stroke-width="3.5" opacity="0.95" />
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#18181B" stroke-width="3.5" />
    </g>

    <!-- Gondola 8: Top-Left (132, 137) -->
    <g transform="translate(132, 137)">
      <circle cx="0" cy="0" r="15" fill="#FAF7F2" stroke="#18181B" stroke-width="3.5" opacity="0.95" />
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#18181B" stroke-width="3.5" />
    </g>

    <!-- Artist Signature in bottom-right corner ("A.") -->
    <g transform="translate(345, 335)">
      <!-- Stylized cursive A loop with flourish and dot -->
      <path d="M 8 22 C 3 14 0 5 10 2 C 18 0 20 18 22 24 C 23 20 25 15 28 15" fill="none" stroke="#18181B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Horizontal cross flourish -->
      <path d="M 4 15 Q 16 13 26 12" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
      <!-- Accompanying dot / slash -->
      <circle cx="29" cy="8" r="2.2" fill="#18181B" />
    </g>
  </g>
</svg>
