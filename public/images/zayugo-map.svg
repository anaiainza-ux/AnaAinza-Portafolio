<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Soft watercolor wash diffusion filters -->
    <filter id="map-wash-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
    <filter id="map-gentle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>
    <filter id="map-pin-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
    </filter>
    <clipPath id="map-canvas-clip">
      <rect x="0" y="0" width="400" height="400" rx="2" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <g clip-path="url(#map-canvas-clip)">
    <!-- Base Warm Cream Canvas Background (#F7F4EF) -->
    <rect width="400" height="400" fill="#F7F4EF" />

    <!-- Paper Grain Texture & Soft Vignette -->
    <rect width="400" height="400" fill="#EFE8DC" opacity="0.4" />
    <circle cx="200" cy="200" r="240" fill="#F7F4EF" opacity="0.6" />

    <!-- Watercolor Washes - Steel Blue (#6096BA) & Frosted Mint (#C8EAD3) -->
    <!-- River / Canal Waterway in Steel Blue -->
    <path
      d="M -30 140 Q 90 120 160 170 T 260 250 T 430 220 L 430 280 Q 280 320 230 290 T 130 220 T -30 190 Z"
      fill="#6096BA"
      filter="url(#map-wash-blur)"
      opacity="0.75"
    />
    <path
      d="M -20 150 Q 80 135 155 180 T 255 260 T 420 235"
      stroke="#6096BA"
      stroke-width="26"
      stroke-linecap="round"
      fill="none"
      filter="url(#map-gentle-blur)"
      opacity="0.8"
    />

    <!-- Secondary Soft Bay / Lake Wash -->
    <ellipse cx="70" cy="80" rx="90" ry="70" fill="#C8EAD3" filter="url(#map-wash-blur)" opacity="0.85" />
    <ellipse cx="320" cy="90" rx="80" ry="60" fill="#C8EAD3" filter="url(#map-wash-blur)" opacity="0.75" />
    <circle cx="340" cy="330" r="85" fill="#C8EAD3" filter="url(#map-wash-blur)" opacity="0.8" />
    <circle cx="80" cy="320" r="70" fill="#6096BA" filter="url(#map-wash-blur)" opacity="0.35" />

    <!-- Watercolor Parks / Districts -->
    <path
      d="M 190 60 Q 260 40 280 110 Q 230 160 180 130 Z"
      fill="#B6C8A9"
      filter="url(#map-wash-blur)"
      opacity="0.7"
    />
    <path
      d="M 120 260 Q 180 270 190 340 Q 110 380 90 310 Z"
      fill="#B6C8A9"
      filter="url(#map-wash-blur)"
      opacity="0.6"
    />

    <!-- Vintage Abstract Street Lines & Grid -->
    <g stroke="#482728" stroke-linecap="round" opacity="0.22">
      <!-- Major Thoroughfares -->
      <line x1="20" y1="90" x2="380" y2="120" stroke-width="2.5" />
      <line x1="30" y1="210" x2="370" y2="180" stroke-width="2.5" />
      <line x1="40" y1="310" x2="360" y2="330" stroke-width="2" />
      <line x1="110" y1="20" x2="90" y2="380" stroke-width="2.5" />
      <line x1="220" y1="20" x2="210" y2="380" stroke-width="3" />
      <line x1="310" y1="30" x2="320" y2="370" stroke-width="2.5" />

      <!-- Secondary Connecting Street Lines -->
      <line x1="70" y1="40" x2="160" y2="140" stroke-width="1.5" />
      <line x1="210" y1="120" x2="310" y2="70" stroke-width="1.5" />
      <line x1="160" y1="170" x2="220" y2="280" stroke-width="1.8" />
      <line x1="260" y1="220" x2="350" y2="280" stroke-width="1.5" />
      <line x1="90" y1="250" x2="170" y2="350" stroke-width="1.5" />
      <line x1="240" y1="290" x2="280" y2="370" stroke-width="1.2" />

      <!-- Minor Alleys and City Blocks -->
      <path d="M 120 70 L 160 80 L 150 115 L 110 105 Z" fill="none" stroke-width="1" stroke-dasharray="3 2" />
      <path d="M 230 70 L 270 75 L 265 110 L 225 105 Z" fill="none" stroke-width="1" stroke-dasharray="3 2" />
      <path d="M 240 140 L 290 135 L 285 175 L 235 170 Z" fill="none" stroke-width="1" stroke-dasharray="3 2" />
      <path d="M 60 230 L 105 225 L 100 270 L 55 275 Z" fill="none" stroke-width="1" stroke-dasharray="3 2" />
      <path d="M 130 300 L 175 305 L 170 345 L 125 340 Z" fill="none" stroke-width="1" stroke-dasharray="3 2" />
      <path d="M 245 250 L 285 245 L 280 280 L 240 285 Z" fill="none" stroke-width="1" stroke-dasharray="3 2" />
    </g>

    <!-- Softer Hand-Painted Watercolor Line Overlays -->
    <g stroke="#6096BA" stroke-linecap="round" opacity="0.45">
      <path d="M 80 100 Q 150 110 210 95 T 320 115" stroke-width="3" fill="none" />
      <path d="M 100 210 Q 170 230 220 200 T 330 220" stroke-width="3" fill="none" />
      <path d="M 215 35 Q 210 130 220 220 T 215 365" stroke-width="3.5" fill="none" />
    </g>

    <!-- Delicate Map Roundabout / Plaza Circles -->
    <circle cx="215" cy="180" r="16" stroke="#482728" stroke-width="2" fill="#F7F4EF" opacity="0.6" />
    <circle cx="215" cy="180" r="8" fill="#6096BA" opacity="0.4" />
    <circle cx="110" cy="120" r="10" stroke="#482728" stroke-width="1.5" fill="#C8EAD3" opacity="0.5" />
    <circle cx="310" cy="240" r="11" stroke="#482728" stroke-width="1.5" fill="#C8EAD3" opacity="0.5" />

    <!-- Small Location Pin Marker at Plaza Intersection -->
    <!-- Pin Drop Shadow -->
    <ellipse cx="215" cy="187" rx="8" ry="4" fill="#482728" opacity="0.3" filter="url(#map-pin-shadow)" />

    <!-- Pin Body (Warm Coral / Espresso Accent with White Core) -->
    <g transform="translate(215, 172)">
      <path
        d="M 0 12 C -6 4 -9 0 -9 -7 C -9 -12 -5 -16 0 -16 C 5 -16 9 -12 9 -7 C 9 0 6 4 0 12 Z"
        fill="#C05C38"
        stroke="#482728"
        stroke-width="1.5"
      />
      <!-- Little Highlight and Center Dot -->
      <circle cx="0" cy="-7" r="3.2" fill="#F7F4EF" />
      <circle cx="-2.5" cy="-9.5" r="1.2" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Translucent Watercolor Glare Sheen -->
    <g opacity="0.18">
      <polygon points="0,180 140,0 185,0 0,240" fill="#FFFFFF" />
      <polygon points="0,290 220,0 240,0 0,320" fill="#FFFFFF" />
    </g>
  </g>
</svg>
